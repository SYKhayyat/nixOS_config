# statix configuration.
#
# `flake.nix` declares `checks.statix` as `statix check .`, and CI's `lint` job
# builds it. That gate had never been run — `statix check .` exited 1 on this
# tree, so `nix flake check` and the `lint` job could not have gone green on any
# commit. This file is what makes the gate a gate rather than a permanent red.
#
# ── Why repeated_keys is off ──────────────────────────────────────────────
#
# W20 flags an attribute set that assigns two dotted paths sharing a first
# component, and asks you to nest them instead:
#
#     services.xserver.enable = true;              →   services = {
#     services.displayManager.sddm.enable = true;  →     xserver.enable = ...;
#                                                       displayManager.sddm... };
#
# That is a reasonable rule for a data attrset and the wrong rule for a NixOS
# module, where the flat dotted form is the house style of nixpkgs itself and
# the whole point is that each line reads as one complete option path. It fired
# 34 times here, in eleven files, on `services`, `programs`, `hardware`,
# `security`, `networking`, `nix`, `home`, `boot` and `stylix` — i.e. on every
# module in the repo that configures more than one thing, including
# hardware-configuration.nix, which is generated by nixos-generate-config and
# cannot be edited to satisfy it.
#
# A lint that fires on generated code and on upstream's own idiom is a lint that
# teaches you to pass `--ignore`, and the next real finding goes past with it.
# The other nineteen checks stay on, and the four genuine findings they made
# (three manual_inherit_from, one empty_pattern) are fixed in the tree rather
# than suppressed here.
disabled = [ "repeated_keys" ]

# Nothing under these is ours to lint.
ignore = [ ".git", "result", "result-*" ]
